name: ACLClouds Auto Renew

on:
  schedule:
    # Daily at 03:17 UTC. Avoiding the top of the hour reduces scheduler congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aclclouds-auto-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check and renew ACLClouds
        env:
          ACL_COOKIES_1: ${{ secrets.ACL_COOKIES_1 }}
          ACL_COOKIES_2: ${{ secrets.ACL_COOKIES_2 }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python renew.py

      - name: Upload diagnostic screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aclclouds-renew-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 3
