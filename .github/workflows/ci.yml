name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile app.py automation.py storage.py crypto_utils.py
          bash -n install.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build Docker image
        run: docker build -t aclclouds-keep:test .
