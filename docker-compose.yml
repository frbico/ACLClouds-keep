services:
  aclkeep:
    build:
      context: .
    image: aclclouds-keep:local
    container_name: ${CONTAINER_NAME:-aclclouds-keep}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    shm_size: "512mb"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
